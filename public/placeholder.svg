<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#065F46" opacity="0.12"/>
    </pattern>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFBEB"/>
      <stop offset="100%" style="stop-color:#FEF3C7"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065F46"/>
      <stop offset="100%" style="stop-color:#044535"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Center card -->
  <rect x="340" y="140" width="520" height="350" rx="32" fill="url(#card)" opacity="0.95"/>

  <!-- Newspaper icon -->
  <g transform="translate(540, 210)">
    <!-- Paper body -->
    <rect x="0" y="0" width="120" height="150" rx="10" fill="white" opacity="0.15"/>
    <!-- Lines -->
    <rect x="12" y="20" width="96" height="8" rx="4" fill="white" opacity="0.4"/>
    <rect x="12" y="36" width="72" height="6" rx="3" fill="white" opacity="0.3"/>
    <rect x="12" y="52" width="96" height="6" rx="3" fill="white" opacity="0.25"/>
    <rect x="12" y="66" width="60" height="6" rx="3" fill="white" opacity="0.25"/>
    <!-- Red accent bar -->
    <rect x="0" y="0" width="8" height="150" rx="4" fill="#DC2626" opacity="0.9"/>
  </g>

  <!-- Fire emoji circle -->
  <circle cx="600" cy="195" r="28" fill="#DC2626" opacity="0.9"/>
  <text x="600" y="205" text-anchor="middle" font-size="28">🔥</text>

  <!-- Brand name -->
  <text x="600" y="415" text-anchor="middle"
    font-family="Georgia, serif" font-size="42" font-weight="700" fill="white" opacity="0.95">
    AmeboGist
  </text>

  <!-- Tagline -->
  <text x="600" y="455" text-anchor="middle"
    font-family="Arial, sans-serif" font-size="18" fill="white" opacity="0.5" letter-spacing="3">
    AMEBO WEY MAKE SENSE
  </text>

  <!-- Bottom trust badge -->
  <rect x="470" y="478" width="260" height="36" rx="18" fill="white" opacity="0.1"/>
  <text x="600" y="501" text-anchor="middle"
    font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white" opacity="0.6"
    letter-spacing="2">
    PART OF BOLDMIND ECOSYSTEM
  </text>
</svg>
